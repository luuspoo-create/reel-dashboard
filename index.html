<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Reel-Pipeline · Digitales Pausenbrot</title>
<link rel="icon" href="https://digitalespausenbrot.ch/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #E94459; --red-d: #C42F43; --red-soft: #FCE8EB;
    --ink: #17171A; --grey: #7d7a73; --hair: #E2DED6; --paper: #F6F4EF; --card: #FFFFFF; --warm: #EFEBE3;
    --ok: #2E7D5B; --ok-soft: #E3F2EA; --amber: #B7791F; --amber-soft: #FBF1DE;
    --r: 18px; --shadow: 0 10px 28px rgba(23,23,26,.08), 0 2px 6px rgba(23,23,26,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 'Space Grotesk', system-ui, sans-serif; }
  body { background-image: radial-gradient(rgba(23,23,26,.05) 1px, transparent 1px); background-size: 14px 14px; }
  button, input, textarea, select { font: inherit; color: inherit; }
  a { color: var(--red-d); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 80px; }
  header { display: flex; align-items: center; gap: 14px; padding: 22px 0 10px; flex-wrap: wrap; }
  header img { width: 44px; height: 44px; }
  header h1 { margin: 0; font: 400 34px/1 'Instrument Serif', serif; letter-spacing: -.01em; }
  header h1 em { color: var(--red); }
  header .sp { flex: 1; }
  .mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .04em; color: var(--grey); text-transform: uppercase; }
  .btn { border: 2px solid var(--ink); background: var(--card); border-radius: 999px; padding: 7px 16px; cursor: pointer; font-weight: 500; display: inline-flex; gap: 8px; align-items: center; white-space: nowrap; }
  .btn:hover { background: var(--warm); }
  .btn.red { background: var(--red); border-color: var(--red); color: #fff; }
  .btn.red:hover { background: var(--red-d); }
  .btn.small { padding: 4px 12px; font-size: 14px; }
  .btn.ghost { border-color: var(--hair); }
  .btn:disabled { opacity: .5; cursor: default; }
  nav { display: flex; gap: 6px; margin: 8px 0 22px; overflow-x: auto; padding-bottom: 4px; }
  nav button { border: 0; background: transparent; padding: 9px 16px; border-radius: 999px; cursor: pointer; font-weight: 500; color: var(--grey); white-space: nowrap; }
  nav button.on { background: var(--ink); color: #fff; }
  nav .count { font-family: 'JetBrains Mono', monospace; font-size: 12px; margin-left: 6px; opacity: .7; }
  .banner { border-radius: var(--r); padding: 12px 16px; margin-bottom: 16px; border: 2px solid; }
  .banner.warn { background: var(--amber-soft); border-color: #E9CF9C; }
  .banner.err { background: var(--red-soft); border-color: #F2B6BF; }
  .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .card { background: var(--card); border: 1.5px solid var(--hair); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
  .reel { display: grid; grid-template-columns: 130px 1fr; }
  .reel .thumb { background: var(--warm); aspect-ratio: 9/16; width: 130px; position: relative; cursor: pointer; }
  .reel .thumb img, .reel .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .reel .thumb .play { position: absolute; inset: auto 8px 8px auto; background: var(--red); color: #fff; border-radius: 999px; width: 38px; height: 38px; display: grid; place-items: center; font-size: 15px; box-shadow: var(--shadow); }
  .reel .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .reel h3 { margin: 0; font: 400 28px/1.05 'Instrument Serif', serif; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 500; background: var(--warm); }
  .chip.red { background: var(--red-soft); color: var(--red-d); }
  .chip.ok { background: var(--ok-soft); color: var(--ok); }
  .chip.amber { background: var(--amber-soft); color: var(--amber); }
  .seg { display: inline-flex; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; background: var(--card); padding: 5px 12px; cursor: pointer; font-size: 14px; font-weight: 500; }
  .seg button + button { border-left: 2px solid var(--ink); }
  .seg button.on[data-v=entwurf] { background: var(--warm); }
  .seg button.on[data-v=bereit] { background: var(--amber-soft); color: var(--amber); }
  .seg button.on[data-v=gepostet] { background: var(--ok); color: #fff; }
  .textbox { border: 1.5px solid var(--hair); border-radius: 12px; background: #FCFBF8; }
  .textbox .tb-head { flex-wrap: wrap; display: flex; align-items: center; gap: 8px; padding: 8px 10px 0 12px; }
  .textbox .tb-head .sp { flex: 1; }
  .textbox pre { margin: 0; padding: 6px 12px 12px; white-space: pre-wrap; word-wrap: break-word; font: 14px/1.5 'Space Grotesk', sans-serif; max-height: 132px; overflow: hidden; position: relative; }
  .textbox.open pre { max-height: none; }
  .textbox:not(.open) pre::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: linear-gradient(transparent, #FCFBF8); }
  .kw { font: 700 15px 'JetBrains Mono', monospace; background: var(--red); color: #fff; border-radius: 8px; padding: 2px 10px; letter-spacing: .06em; }
  .stats-row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; }
  .stats-row b { font-size: 18px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--grey); font-size: 14px; }
  input[type=text], input[type=password], input[type=url], input[type=search], textarea, select { width: 100%; border: 1.5px solid var(--hair); border-radius: 12px; padding: 9px 12px; background: #fff; }
  textarea { min-height: 70px; resize: vertical; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--red); border-color: transparent; }
  .arch { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--hair); cursor: pointer; }
  .arch:last-child { border-bottom: 0; }
  .arch img { width: 40px; height: 71px; object-fit: cover; border-radius: 6px; background: var(--warm); }
  .arch .t { font-weight: 700; }
  .arch .sp { flex: 1; min-width: 0; }
  .idea { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .idea h3 { margin: 0; font: 400 25px/1.1 'Instrument Serif', serif; }
  .idea .hook { font-style: italic; border-left: 3px solid var(--red); padding-left: 10px; }
  .idea.dim { opacity: .55; }
  .stars { color: var(--red); letter-spacing: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: right; padding: 9px 10px; border-bottom: 1px solid var(--hair); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; white-space: normal; }
  th { font: 700 11px 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: .05em; color: var(--grey); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .kpi { padding: 16px; }
  .kpi .v { font: 700 34px/1.1 'Space Grotesk', sans-serif; }
  .kpi .v.red { color: var(--red); }
  .empty { text-align: center; padding: 40px 16px; color: var(--grey); }
  .empty .big { font: 400 30px 'Instrument Serif', serif; color: var(--ink); }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 500; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; }
  .toast.on { opacity: 1; }
  .login { max-width: 560px; margin: 40px auto; padding: 26px; }
  .login h2 { font: 400 34px/1.1 'Instrument Serif', serif; margin: 0 0 10px; }
  .login ol { padding-left: 20px; }
  .login li { margin-bottom: 6px; }
  .modal { position: fixed; inset: 0; background: rgba(23,23,26,.55); display: grid; place-items: center; z-index: 8; padding: 16px; }
  .modal .card { max-width: 420px; width: 100%; padding: 14px; }
  .modal video { width: 100%; max-height: 74vh; border-radius: 12px; background: #000; display: block; }
  .pill-filter { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .pill-filter button { border: 1.5px solid var(--hair); background: var(--card); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 14px; }
  .pill-filter button.on { border-color: var(--red); background: var(--red-soft); color: var(--red-d); }
  .section-title { font: 400 28px 'Instrument Serif', serif; margin: 28px 0 12px; }
  @media (max-width: 520px) {
    .reel { grid-template-columns: 96px 1fr; } .reel .thumb { width: 96px; }
    .reel h3 { font-size: 24px; } header h1 { font-size: 28px; }
    .hide-s { display: none; }
    nav { flex-wrap: wrap; overflow: visible; } nav button { padding: 8px 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="https://digitalespausenbrot.ch/favicon.svg" alt="">
    <h1>Reel-<em>Pipeline</em></h1>
    <span class="sp"></span>
    <span class="mono" id="synced"></span>
    <button class="btn small ghost" id="reload" title="Neu laden">↻ Aktualisieren</button>
  </header>
  <div id="app"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const REPO = 'luuspoo-create/reel-pipeline';
const API = 'https://api.github.com';
const LS = k => { try { return localStorage.getItem(k); } catch { return null; } };
const LSset = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => new Date().toISOString().slice(0, 10);
const fmtDate = d => d ? new Date(d).toLocaleDateString('de-CH', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const fmtN = n => n == null ? '–' : Number(n).toLocaleString('de-CH');

let state = { tab: LS('tab') || 'posten', reels: null, ideas: null, stats: null, sha: {}, search: '', ideaFilter: 'offen', open: {} };
const thumbs = {};

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2200); }

// ── GitHub API ──
const token = () => LS('gh_token');
async function gh(path, opt = {}) {
  const r = await fetch(API + path, { ...opt, headers: { Authorization: `Bearer ${token()}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opt.headers || {}) } });
  if (r.status === 401) { LSset('gh_token', null); render(); throw new Error('Schlüssel ungültig'); }
  return r;
}
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, '')), c => c.charCodeAt(0)));
const b64enc = s => { const b = new TextEncoder().encode(s); let x = ''; for (let i = 0; i < b.length; i += 0x8000) x += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(x); };
async function getJSON(path, fallback) {
  const r = await gh(`/repos/${REPO}/contents/${path}?ref=main&t=${Date.now()}`);
  if (r.status === 404) { state.sha[path] = null; return fallback; }
  if (!r.ok) throw new Error(`${path}: ${r.status}`);
  const j = await r.json(); state.sha[path] = j.sha;
  return JSON.parse(b64dec(j.content));
}
// read-modify-write with a retry when someone else (the 06:00 job, another device) changed the file in between
async function mutate(path, fallback, fn, msg) {
  for (let i = 0; i < 3; i++) {
    const data = await getJSON(path, fallback);
    fn(data);
    const body = { message: msg, content: b64enc(JSON.stringify(data, null, 2) + '\n'), branch: 'main' };
    if (state.sha[path]) body.sha = state.sha[path];
    const r = await gh(`/repos/${REPO}/contents/${path}`, { method: 'PUT', body: JSON.stringify(body) });
    if (r.ok) { state.sha[path] = (await r.json()).content.sha; return data; }
    if (r.status !== 409 && r.status !== 422) throw new Error(`Speichern fehlgeschlagen (${r.status})`);
  }
  throw new Error('Speichern fehlgeschlagen: bitte neu laden');
}
async function loadAll() {
  $('#synced').textContent = 'lädt …';
  const [reels, ideas, stats] = await Promise.all([getJSON('data/reels.json', { reels: [] }), getJSON('data/ideas.json', { ideas: [] }), getJSON('data/stats.json', null)]);
  Object.assign(state, { reels: reels.reels || [], ideas: ideas.ideas || [], stats });
  $('#synced').textContent = 'stand ' + new Date().toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
  render();
  state.reels.forEach(r => loadThumb(r));
}
async function loadThumb(r) {
  if (!r.thumb || thumbs[r.slug]) return;
  try {
    const res = await gh(`/repos/${REPO}/contents/${r.thumb}`, { headers: { Accept: 'application/vnd.github.raw' } });
    if (!res.ok) return;
    thumbs[r.slug] = URL.createObjectURL(await res.blob());
    document.querySelectorAll(`img[data-thumb="${r.slug}"]`).forEach(i => i.src = thumbs[r.slug]);
  } catch {}
}
// The full video lives in a Release; its download server blocks browser pages (no CORS), so the player uses the small preview on the
// 'media' branch (served by the API with CORS) and "Herunterladen" opens the Release file as a normal page (works when logged in to GitHub).
const fullUrl = r => `https://github.com/${REPO}/releases/download/${r.video_tag}/${r.video_asset}`;
async function videoUrl(r) {
  if (!r.preview) throw new Error('Für dieses Reel gibt es noch keine Vorschau');
  const res = await gh(`/repos/${REPO}/contents/${r.preview}?ref=media`, { headers: { Accept: 'application/vnd.github.raw' } });
  if (!res.ok) throw new Error(`Vorschau konnte nicht geladen werden (${res.status})`);
  return URL.createObjectURL(new Blob([await res.arrayBuffer()], { type: 'video/mp4' }));
}

// ── actions ──
async function setStatus(slug, status) {
  if (state.reels.find(r => r.slug === slug)?.postiz?.post_id) return toast('Diesen Beitrag bitte in Postiz verwalten');
  const link = status === 'gepostet' ? (prompt('Link zum Instagram-Beitrag (optional, sonst ergänzt ihn der 06:00-Abruf automatisch):') || '').trim() : null;
  try {
    const data = await mutate('data/reels.json', { reels: [] }, d => {
      const r = d.reels.find(x => x.slug === slug); if (!r) return;
      if (r.postiz?.post_id) throw new Error('Inzwischen in Postiz eingeplant – bitte aktualisieren');
      r.status = status;
      if (status === 'gepostet') { r.posted = r.posted || today(); if (link) r.ig_permalink = link; } else { r.posted = null; }
    }, `Reel ${slug}: ${status}`);
    state.reels = data.reels; render();
    toast(status === 'gepostet' ? 'Ab ins Archiv ✓' : 'Status gespeichert ✓');
  } catch (e) { toast(e.message); }
}
async function setIdea(id, patch, msg) {
  try { const d = await mutate('data/ideas.json', { ideas: [] }, d => { const i = d.ideas.find(x => x.id === id); if (i) Object.assign(i, patch); }, msg); state.ideas = d.ideas; render(); toast('Gespeichert ✓'); }
  catch (e) { toast(e.message); }
}
async function addIdea(form) {
  const f = Object.fromEntries(new FormData(form));
  if (!f.title.trim()) return toast('Titel fehlt');
  const idea = { id: f.title.toLowerCase().replace(/[^a-z0-9äöü]+/g, '-').slice(0, 40) + '-' + Date.now().toString(36).slice(-4), title: f.title.trim(), hook: f.hook.trim(), angle: f.angle.trim(),
    keyword: f.keyword.trim().toUpperCase(), category: f.category, source: 'eigene Idee', score: 3, status: 'neu', added: today() };
  try { const d = await mutate('data/ideas.json', { ideas: [] }, d => { d.ideas.unshift(idea); d.updated = today(); }, `Idee: ${idea.title}`); state.ideas = d.ideas; form.reset(); render(); toast('Idee gespeichert ✓'); }
  catch (e) { toast(e.message); }
}
async function runStats() {
  const r = await gh(`/repos/${REPO}/actions/workflows/stats.yml/dispatches`, { method: 'POST', body: JSON.stringify({ ref: 'main' }) });
  toast(r.ok ? 'Abruf gestartet, in ~1 Minute neu laden' : 'Start fehlgeschlagen (Schlüssel braucht Recht «Actions»)');
}
async function copy(text, what) { try { await navigator.clipboard.writeText(text); toast(`${what} kopiert ✓`); } catch { toast('Kopieren nicht möglich'); } }
async function play(slug) {
  const r = state.reels.find(x => x.slug === slug);
  const m = document.createElement('div'); m.className = 'modal';
  const dl = `<div class="row" style="margin-top:10px"><a class="btn red small" href="${fullUrl(r)}" target="_blank" rel="noopener">↓ Volle Qualität (${r.size_mb} MB)</a><span class="muted">zum Posten · du musst im Browser bei GitHub eingeloggt sein</span></div>`;
  m.innerHTML = `<div class="card"><div class="row" style="margin-bottom:10px"><b style="flex:1">${esc(r.title)}</b><button class="btn small ghost" data-close>✕</button></div><div class="empty">Vorschau lädt …</div>${dl}</div>`;
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) { m.remove(); } });
  document.body.appendChild(m);
  try {
    const url = await videoUrl(r);
    m.querySelector('.empty').outerHTML = `<video src="${url}" controls autoplay playsinline></video><div class="muted" style="margin-top:6px">Vorschau in reduzierter Qualität</div>`;
  } catch (e) {
    m.querySelector('.empty').innerHTML = esc(e.message);
  }
}

// ── views ──
function postStats(r) {
  if (!state.stats?.posts || !r.ig_id) return '';
  const p = state.stats.posts.find(x => x.id === r.ig_id); if (!p) return '';
  return `<div class="stats-row"><span><b>${fmtN(p.views)}</b> Views</span><span><b>${fmtN(p.likes)}</b> Likes</span><span><b>${fmtN(p.comments)}</b> Kommentare</span><span><b>${fmtN(p.saved)}</b> Gespeichert</span><span><b>${fmtN(p.shares)}</b> Geteilt</span></div>`;
}
const statusChip = s => s === 'geplant' ? '<span class="chip amber">geplant</span>' : s === 'pruefen' ? '<span class="chip red">Planung prüfen</span>' : s === 'gepostet' ? '<span class="chip ok">gepostet</span>' : s === 'bereit' ? '<span class="chip amber">bereit</span>' : '<span class="chip">Entwurf</span>';
function textBox(id, label, text, extra = '') {
  const open = state.open[id];
  return `<div class="textbox ${open ? 'open' : ''}" data-id="${id}"><div class="tb-head"><span class="mono">${label}</span>${extra}<span class="sp"></span>
    <button class="btn small ghost" data-toggle="${id}">${open ? 'weniger' : 'alles'}</button><button class="btn small" data-copy="${id}">Kopieren</button></div><pre>${esc(text)}</pre></div>`;
}
function reelCard(r) {
  return `<article class="card reel">
    <div class="thumb" data-play="${r.slug}"><img data-thumb="${r.slug}" src="${thumbs[r.slug] || ''}" alt=""><span class="play">▶</span></div>
    <div class="body">
      <div class="row"><span class="mono">${fmtDate(r.created)} · ${r.duration ?? ''} s</span>${statusChip(r.status)}</div>
      <h3>${esc(r.title)}</h3>
      ${r.postiz?.post_id ? `<div class="muted">${r.postiz.state === 'QUEUE' ? `Geplant für ${esc(new Date(r.postiz.scheduled_at).toLocaleString('de-CH', { timeZone: 'Europe/Zurich', dateStyle: 'medium', timeStyle: 'short' }))} Uhr (Schweizer Zeit)` : r.postiz.state === 'PUBLISHED' ? 'Über Postiz veröffentlicht' : 'Planung bitte in Postiz prüfen'} · Originalqualität</div><div><a class="btn small" href="https://postiz.spohnstack.io/" target="_blank" rel="noopener">In Postiz verwalten ↗</a></div>` : `<div class="seg" data-slug="${r.slug}">${['entwurf', 'bereit', 'gepostet'].map(v => `<button data-v="${v}" class="${r.status === v ? 'on' : ''}">${v === 'entwurf' ? 'Entwurf' : v === 'bereit' ? 'Bereit' : 'Gepostet'}</button>`).join('')}</div>`}
      ${r.posted ? `<div class="muted">gepostet am ${fmtDate(r.posted)}${r.ig_permalink ? ` · <a href="${esc(r.ig_permalink)}" target="_blank" rel="noopener">auf Instagram</a>` : ''}</div>` : ''}
      ${postStats(r)}
      ${textBox(`cap-${r.slug}`, 'Instagram-Text', r.caption)}
      ${textBox(`dm-${r.slug}`, 'DM für', r.dm, `<span class="kw">${esc(r.keyword)}</span>`)}
    </div></article>`;
}
function viewPosten() {
  const list = state.reels.filter(r => !['gepostet', 'geplant'].includes(r.status));
  if (!list.length) return `<div class="card empty"><div class="big">Alles gepostet.</div>Neue Reels erscheinen hier, sobald sie fertig gerendert und hochgeladen sind.</div>`;
  return `<div class="grid">${list.map(reelCard).join('')}</div>`;
}
function viewGeplant() {
  const list = state.reels.filter(r => r.status === 'geplant').sort((a,b) => (a.postiz?.scheduled_at || '').localeCompare(b.postiz?.scheduled_at || ''));
  return `<div class="muted" style="margin-bottom:16px">Täglich ein Reel · Originalqualität · Termine in Schweizer Zeit. Terminänderungen und Absagen bitte in Postiz vornehmen; der Abgleich erfolgt alle 15 Minuten.</div>${list.length ? `<div class="grid">${list.map(reelCard).join('')}</div>` : '<div class="card empty"><div class="big">Noch keine Reels geplant.</div>Bestätigte Postiz-Termine erscheinen hier automatisch.</div>'}`;
}
function viewArchiv() {
  const q = state.search.toLowerCase();
  const list = state.reels.filter(r => r.status === 'gepostet').filter(r => !q || (r.title + r.keyword + r.caption).toLowerCase().includes(q)).sort((a, b) => (b.posted || '').localeCompare(a.posted || ''));
  const openSlug = state.open.archiv;
  return `<input type="search" id="search" placeholder="Im Archiv suchen (Titel, Keyword, Text) …" value="${esc(state.search)}" style="margin-bottom:14px">
    ${openSlug && list.find(r => r.slug === openSlug) ? `<div style="margin-bottom:18px">${reelCard(list.find(r => r.slug === openSlug))}</div>` : ''}
    ${list.length ? `<div class="card">${list.map(r => `<div class="arch" data-arch="${r.slug}"><img data-thumb="${r.slug}" src="${thumbs[r.slug] || ''}" alt=""><div class="sp"><div class="t">${esc(r.title)}</div><div class="muted">${fmtDate(r.posted)} · <span class="kw" style="font-size:12px">${esc(r.keyword)}</span></div></div>${postStats(r) ? `<span class="muted hide-s">${fmtN((state.stats.posts.find(x => x.id === r.ig_id) || {}).views)} Views</span>` : ''}<span>›</span></div>`).join('')}</div>`
      : `<div class="card empty"><div class="big">Noch nichts im Archiv.</div>Setze ein Reel auf «Gepostet», dann landet es hier.</div>`}`;
}
const CATS = ['KI-Didaktik', 'Pausenbrot', 'Studien', 'Tools', 'Einrichtungen'];
function viewIdeen() {
  const f = state.ideaFilter;
  const list = state.ideas.filter(i => f === 'alle' || (f === 'offen' ? ['neu', 'ausgewählt'].includes(i.status) : i.status === f))
    .sort((a, b) => (a.status === 'ausgewählt' ? -1 : 0) - (b.status === 'ausgewählt' ? -1 : 0) || (b.added || '').localeCompare(a.added || '') || (b.score || 0) - (a.score || 0));
  return `<div class="pill-filter">${[['offen', 'Offen'], ['ausgewählt', 'Ausgewählt'], ['umgesetzt', 'Umgesetzt'], ['verworfen', 'Verworfen'], ['alle', 'Alle']].map(([v, l]) => `<button data-if="${v}" class="${f === v ? 'on' : ''}">${l}</button>`).join('')}</div>
    <div class="grid">${list.map(i => `<article class="card idea ${i.status === 'verworfen' ? 'dim' : ''}">
      <div class="row"><span class="chip red">${esc(i.category || 'Idee')}</span><span class="stars">${'●'.repeat(i.score || 0)}${'○'.repeat(5 - (i.score || 0))}</span><span class="mono" style="margin-left:auto">${fmtDate(i.added)}</span></div>
      <h3>${esc(i.title)}</h3>
      ${i.hook ? `<div class="hook">${esc(i.hook)}</div>` : ''}
      ${i.angle ? `<div class="muted">${esc(i.angle)}</div>` : ''}
      <div class="row">${i.keyword ? `<span class="kw">${esc(i.keyword)}</span>` : ''}${i.source ? `<span class="muted">${i.url ? `<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.source)}</a>` : esc(i.source)}</span>` : ''}</div>
      <div class="row" style="margin-top:4px">
        ${i.status !== 'ausgewählt' ? `<button class="btn small red" data-idea="${i.id}" data-s="ausgewählt">★ Auswählen</button>` : `<span class="chip amber">ausgewählt</span>`}
        <button class="btn small" data-prompt="${i.id}">Prompt für Claude</button>
        ${i.status !== 'umgesetzt' ? `<button class="btn small ghost" data-idea="${i.id}" data-s="umgesetzt">✓ Umgesetzt</button>` : ''}
        ${i.status !== 'verworfen' ? `<button class="btn small ghost" data-idea="${i.id}" data-s="verworfen">Verwerfen</button>` : `<button class="btn small ghost" data-idea="${i.id}" data-s="neu">Zurückholen</button>`}
      </div></article>`).join('') || `<div class="card empty"><div class="big">Keine Ideen hier.</div></div>`}</div>
    <h2 class="section-title">Eigene Idee eintragen</h2>
    <form class="card" id="ideaForm" style="padding:16px;display:grid;gap:10px">
      <input type="text" name="title" placeholder="Titel, z. B. «KI-Feedback, das wirklich hilft»">
      <textarea name="hook" placeholder="Hook: der erste Satz des Reels"></textarea>
      <textarea name="angle" placeholder="Worum geht es? Zahlen, Quelle, Beispiel …"></textarea>
      <div class="row" style="flex-wrap:nowrap"><input type="text" name="keyword" placeholder="Keyword (z. B. FEEDBACK)"><select name="category">${CATS.map(c => `<option>${c}</option>`).join('')}</select></div>
      <div><button class="btn red" type="submit">Idee speichern</button></div>
    </form>`;
}
function spark(hist) {
  const pts = (hist || []).filter(h => h.followers != null); if (pts.length < 2) return '';
  const vs = pts.map(p => p.followers), mn = Math.min(...vs), mx = Math.max(...vs), w = 240, h = 46;
  const d = pts.map((p, i) => `${(i / (pts.length - 1) * w).toFixed(1)},${(h - 4 - (mx === mn ? .5 : (p.followers - mn) / (mx - mn)) * (h - 8)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none"><polyline points="${d}" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
}
function viewZahlen() {
  const s = state.stats;
  const head = `<div class="row" style="margin-bottom:14px"><span class="muted" style="flex:1">Automatischer Abruf jeden Morgen um 06:00 Uhr${s?.checked ? ` · zuletzt ${new Date(s.checked).toLocaleString('de-CH', { dateStyle: 'medium', timeStyle: 'short' })}` : ''}</span><button class="btn small" id="runStats">Jetzt abrufen</button></div>`;
  if (!s) return head + `<div class="banner warn">Noch keine Zahlen. Der erste Abruf läuft morgen um 06:00, oder tippe auf «Jetzt abrufen».</div>`;
  const err = s.ok === false ? `<div class="banner err"><b>Abruf fehlgeschlagen.</b> ${esc(s.error || '')}</div>` : '';
  const posts = (s.posts || []).slice().sort((a, b) => (b.timestamp || '').localeCompare(a.timestamp || ''));
  const reelPosts = posts.filter(p => ['REELS', 'VIDEO'].includes(p.type));
  const sum = k => reelPosts.reduce((a, p) => a + (p[k] || 0), 0);
  return head + err + (s.posts ? `
    <div class="kpis">
      <div class="card kpi"><div class="mono">Follower</div><div class="v red">${fmtN(s.followers)}</div>${spark(s.followers_history)}</div>
      <div class="card kpi"><div class="mono">Reels (letzte 50 Beiträge)</div><div class="v">${fmtN(reelPosts.length)}</div></div>
      <div class="card kpi"><div class="mono">Views Reels</div><div class="v">${fmtN(sum('views'))}</div></div>
      <div class="card kpi"><div class="mono">Gespeichert + Geteilt</div><div class="v">${fmtN(sum('saved') + sum('shares'))}</div></div>
    </div>
    <div class="card" style="overflow-x:auto"><table>
      <thead><tr><th>Beitrag</th><th>Datum</th><th>Views</th><th>Reichweite</th><th>Likes</th><th>Komm.</th><th>Gesp.</th><th>Geteilt</th></tr></thead>
      <tbody>${posts.map(p => `<tr><td><a href="${esc(p.permalink)}" target="_blank" rel="noopener">${esc((p.caption || '(ohne Text)').split('\n')[0].slice(0, 70))}</a> <span class="muted">${p.type === 'REELS' ? '· Reel' : ''}</span></td>
        <td>${fmtDate(p.timestamp)}</td><td><b>${fmtN(p.views)}</b></td><td>${fmtN(p.reach)}</td><td>${fmtN(p.likes)}</td><td>${fmtN(p.comments)}</td><td>${fmtN(p.saved)}</td><td>${fmtN(p.shares)}</td></tr>`).join('')}</tbody>
    </table></div>` : '');
}
function viewLogin() {
  return `<div class="card login">
    <h2>Einmal <em style="color:var(--red)">einloggen</em></h2>
    <p class="muted">Alle Daten liegen in deinem privaten Repo <b>${REPO}</b>. Diese Seite enthält selbst keine Daten. Sie liest und schreibt mit einem persönlichen GitHub-Schlüssel, der nur auf diesem Gerät gespeichert wird.</p>
    <ol>
      <li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub → Neuer Fine-grained token</a> öffnen.</li>
      <li>Name: «Reel-Dashboard», Ablauf: 1 Jahr. Unter <b>Repository access</b> «Only select repositories» → <b>reel-pipeline</b>.</li>
      <li>Unter <b>Permissions</b>: <b>Contents</b> = Read and write, <b>Actions</b> = Read and write.</li>
      <li>«Generate token», kopieren und hier einfügen.</li>
    </ol>
    <form id="loginForm" class="row" style="flex-wrap:nowrap"><input type="password" name="t" placeholder="github_pat_…" autocomplete="off"><button class="btn red" type="submit">Los</button></form>
    <p class="muted">Auf jedem Gerät (Laptop, Handy) einmal nötig.</p>
  </div>`;
}
function render() {
  const app = $('#app');
  if (!token()) { app.innerHTML = viewLogin(); $('#reload').style.display = 'none'; return; }
  $('#reload').style.display = '';
  if (!state.reels) { app.innerHTML = `<div class="empty">lädt …</div>`; return; }
  const n = { posten: state.reels.filter(r => !['gepostet', 'geplant'].includes(r.status)).length, archiv: state.reels.filter(r => r.status === 'gepostet').length, ideen: state.ideas.filter(i => i.status === 'neu' || i.status === 'ausgewählt').length };
  const tabs = [['posten', 'Zum Posten', n.posten], ['geplant', 'Geplant', state.reels.filter(r => r.status === 'geplant').length], ['archiv', 'Archiv', n.archiv], ['ideen', 'Ideen', n.ideen], ['zahlen', 'Zahlen', null]];
  const warn = state.stats && state.stats.ok === false && state.tab !== 'zahlen' ? `<div class="banner warn">Instagram-Zahlen konnten nicht geholt werden. Details unter «Zahlen».</div>` : '';
  app.innerHTML = `<nav>${tabs.map(([k, l, c]) => `<button data-tab="${k}" class="${state.tab === k ? 'on' : ''}">${l}${c != null ? `<span class="count">${c}</span>` : ''}</button>`).join('')}<span style="flex:1"></span><button class="btn small ghost" id="logout" title="Schlüssel von diesem Gerät entfernen">Abmelden</button></nav>
    ${warn}${{ posten: viewPosten, geplant: viewGeplant, archiv: viewArchiv, ideen: viewIdeen, zahlen: viewZahlen }[state.tab]()}`;
  const s = $('#search'); if (s && state._focusSearch) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
}

// ── events (one delegated listener) ──
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-play], [data-arch]'); if (!t) return;
  if (t.dataset.tab) { state.tab = t.dataset.tab; LSset('tab', state.tab); render(); }
  else if (t.id === 'reload') loadAll().catch(err => toast(err.message));
  else if (t.id === 'logout') { if (confirm('Schlüssel von diesem Gerät entfernen?')) { LSset('gh_token', null); state.reels = null; render(); } }
  else if (t.id === 'runStats') runStats();
  else if (t.closest('.seg') && t.dataset.v) { const slug = t.closest('.seg').dataset.slug, r = state.reels.find(x => x.slug === slug); if (r.status !== t.dataset.v) setStatus(slug, t.dataset.v); }
  else if (t.dataset.play) play(t.dataset.play);
  else if (t.dataset.arch) { state.open.archiv = state.open.archiv === t.dataset.arch ? null : t.dataset.arch; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  else if (t.dataset.toggle) { state.open[t.dataset.toggle] = !state.open[t.dataset.toggle]; render(); }
  else if (t.dataset.copy) { const [kind, ...rest] = t.dataset.copy.split('-'), r = state.reels.find(x => x.slug === rest.join('-')); copy(kind === 'cap' ? r.caption : r.dm, kind === 'cap' ? 'Instagram-Text' : 'DM-Text'); }
  else if (t.dataset.if) { state.ideaFilter = t.dataset.if; render(); }
  else if (t.dataset.idea) setIdea(t.dataset.idea, { status: t.dataset.s }, `Idee ${t.dataset.idea}: ${t.dataset.s}`);
  else if (t.dataset.prompt) { const i = state.ideas.find(x => x.id === t.dataset.prompt); copy(`Mach ein Reel zu dieser Idee aus dem Dashboard:\n\nTitel: ${i.title}\nHook: ${i.hook || ''}\nInhalt: ${i.angle || ''}\nKeyword: ${i.keyword || ''}\nQuelle: ${i.source || ''}${i.url ? ' ' + i.url : ''}\n\nFakten nur aus der Quelle bzw. meinen Substack-Beiträgen. Danach mit publish_reel.py hochladen.`, 'Prompt'); }
});
document.addEventListener('input', e => { if (e.target.id === 'search') { state.search = e.target.value; state._focusSearch = true; render(); state._focusSearch = false; } });
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'loginForm') { const v = new FormData(e.target).get('t').trim(); if (!v) return; LSset('gh_token', v); render(); loadAll().catch(err => toast(err.message)); }
  if (e.target.id === 'ideaForm') addIdea(e.target);
});

render();
if (token()) loadAll().catch(err => { $('#app').innerHTML = `<div class="banner err">${esc(err.message)}</div>`; });
</script>
</body>
</html>
